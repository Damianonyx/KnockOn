services:
  export:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - univer-license-state:/home/node/.local/state
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  univer-license-state:
